name: C2_matching_mse
suffix: ~  # add suffix to saved images
scale: 4
model_type: RefRestorationModel
set_CUDA_VISIBLE_DEVICES: ~
crop_border: ~  # crop border when evaluation. If None(~), crop the scale pixels
gpu_ids: [1]

datasets:
  test_1:  # the 1st test dataset
    name: dataset_dame
    type: RefCUFEDDataset
    dataroot_in: /data/zhouhongyang/zhouhongyang/GNNSR/datasets/CUFED/test/CUFED5_mult3
    dataroot_ref: /data/zhouhongyang/zhouhongyang/GNNSR/datasets/CUFED/test/CUFED5_mult3
    io_backend:
      type: disk

    bicubic_model: PIL

    ann_file: /data/zhouhongyang/zhouhongyang/Reference/Ours_CVPR2024/ours2/datasets/CUFED5_pairs.txt

val_func: BasicSRValidation
save_img: true

#### network structures
network_g:
  type: RestorationNet
  ngf: 64
  n_blocks: 16
  groups: 8
network_map:
  type: CorrespondenceGenerationArch
  patch_size: 3
  stride: 1
  vgg_layer_list: ['relu1_1', 'relu2_1', 'relu3_1']
  vgg_type: 'vgg19'
network_extractor:
  type: ContrasExtractorSep

#### path
path:
  pretrain_model_g: /data/zhouhongyang/zhouhongyang/Reference/Ours_CVPR2024/ours2/experiments/stage3_restoration_mse_ours/models/net_g_865000.pth
  pretrain_model_feature_extractor: /data/zhouhongyang/zhouhongyang/Reference/C2-matching1/experiments/stage2_student_contras_network/models/net_student_latest.pth
  strict_load: true
